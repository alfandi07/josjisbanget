<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Absensi Sekolah QR Code</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://unpkg.com/html5-qrcode"></script>
</head>

<body>

    <div class="container">

        <header>
            <h1>ABSENSI SEKOLAH</h1>
            <p>Sistem Absensi Berbasis QR Code</p>
        </header>

        <section class="dashboard">

            <div class="card">
                <h3>Total Siswa</h3>
                <h2 id="totalSiswa">0</h2>
            </div>

            <div class="card">
                <h3>Siswa Hadir</h3>
                <h2 id="totalHadir">0</h2>
            </div>

            <div class="card">
                <h3>Belum Hadir</h3>
                <h2 id="belumHadir">0</h2>
            </div>

        </section>

        <section class="content">

            <h2>Scan QR Code</h2>

            <div id="reader"></div>

            <p id="pesan">Silakan scan QR Code siswa.</p>

            <hr>

            <h2>Tambah Data Siswa</h2>

            <input type="text" id="nama" placeholder="Nama siswa">

            <input type="text" id="nis" placeholder="Nomor Induk Siswa">

            <input type="text" id="kelas" placeholder="Kelas">

            <button onclick="tambahSiswa()">
                Tambahkan Siswa
            </button>

            <hr>

            <h2>Daftar Kehadiran</h2>

            <div class="table-container">

                <table>

                    <thead>
                        <tr>
                            <th>Nama</th>
                            <th>NIS</th>
                            <th>Kelas</th>
                            <th>Tanggal</th>
                            <th>Jam</th>
                        </tr>
                    </thead>

                    <tbody id="daftarAbsensi"></tbody>

                </table>

            </div>

            <button onclick="downloadLaporan()">
                Download Laporan
            </button>

        </section>

    </div>

    <script src="script.js"></script>

</body>
</html>
