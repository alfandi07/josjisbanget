<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absensi SMAN 1 Bendungan</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <section id="halamanAwal" class="halaman">
        <h1>Selamat Datang!</h1>
        <h2>SMAN 1 Bendungan</h2>
        <p>Sistem Absensi Siswa Kelas XI</p>
        <button onclick="mulaiAbsensi()">Mulai Absensi</button>
    </section>

    <section id="halamanSiswa" class="halaman" style="display:none;">
        <h2>Daftar Siswa</h2>
        <p>Silakan pilih nama Anda</p>

        <div id="daftarSiswa"></div>

        <button onclick="kembali()">Kembali</button>
    </section>

    <section id="halamanQR" class="halaman" style="display:none;">
        <h2>QR Code Absensi</h2>
        <h3 id="namaSiswa"></h3>
        <p id="nisSiswa"></p>

        <div id="kodeQR"></div>

        <p>Silakan tunjukkan QR Code kepada petugas.</p>

        <button onclick="kembaliKeSiswa()">Kembali</button>
    </section>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
